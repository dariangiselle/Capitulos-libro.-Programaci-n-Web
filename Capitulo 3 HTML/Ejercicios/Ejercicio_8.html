        <h1>Formulario Autocomple con un elemento datalist</h1>
        <form method="post" autocomplete="on">
            <p><label for="listatexto">D&iacute;as de la Semana:
                <input type="text" id="listatexto"
                placeholder="Seleccione un día de la semana:" list="dias"/>

                <datalist id="dias">
                    <option value="Lunes">
                    <option value="Martes">
                    <option value="Miercoles">
                    <option value="Jueves">
                    <option value="Viernes">
                    <option value="Sabado">
                    <option value="Domingo">
                </datalist>
            </label></p>
                
        </form>

    </body>
