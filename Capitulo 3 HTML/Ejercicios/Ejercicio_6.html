        <h1>Formulario de registro Web con respuesta opcional</h1>
        <form method="post" autocomplete="on">
            <p><label>Primer nombre:
                <input type="text" id="primerNombre"
                placeholder="Primer nombre" /> (Primer nombre)
            </label></p>
            <p><label>Apellido:
                <input type="text" id="apellido"
                placeholder="Apellido" /> (Apellido)
            </label></p>
            <p><label>Correo:
                <input type="email" id="email"
                placeholder="nombre@dominio.com" /> (nombre@dominio.com)
            </label></p>

            <details>
                <summary>Ver pregunta de encuesta opcional</summary>
                    <p>¿En qu&eacute; a&ntilde;o universitario te encuentras?</p>
                    <p>
                        <label><input type="radio", name="uni", value="1"> Primer a&ntilde;o</label>
                        <label><input type="radio", name="uni", value="2"> Segundo a&ntilde;o</label>
                        <label><input type="radio", name="uni", value="3"> Tercer a&ntilde;o</label>
                        <label><input type="radio", name="uni", value="4"> Cuarto a&ntilde;o</label>
                        <label><input type="radio", name="uni", value="5"> A&ntilde;o Superior</label>
                    </p>
            </details>
            
            <p><input type="submit" value="Enviar" />
                <input type="reset" value="Borrar" /></p> 
        
        </form>
    </body>
